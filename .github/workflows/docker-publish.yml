name: Build and Publish Docker Image to GHCR

on:
  push:
    branches: [ "main", "beta" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "beta" ]
  workflow_dispatch:

concurrency:
  group: verydisco-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Backend regression tests
        run: |
          python -m pip install -r backend/requirements.txt pytest pytest-asyncio respx
          python -m pytest backend/tests docs/audit/test_snapshot_findings.py -q
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: docker build --tag verydisco:smoke .
      - name: Check clean startup and production runtime
        run: |
          docker run --detach --name verydisco-smoke --publish 127.0.0.1:18086:8080 verydisco:smoke
          curl --fail --silent --show-error --max-time 10 --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 90 http://127.0.0.1:18086/healthz
          docker exec verydisco-smoke python /app/scripts/container_smoke.py
          docker exec verydisco-smoke fpcalc -version
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs verydisco-smoke || true
          docker rm --force verydisco-smoke || true

  build-and-push:
    needs: [test, container-smoke]
    if: github.ref == 'refs/heads/beta' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require release tag to be on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Stable tags must use vMAJOR.MINOR.PATCH"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
